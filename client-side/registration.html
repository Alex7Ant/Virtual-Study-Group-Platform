<!DOCTYPE html>
<html lang="en">
    <head>
        <meta>
        <meta>
        <title>Registration Form</title>
        <link rel="stylesheet" href="./css/register.css">
    </head>


    <br><br>  

    <body>

        <div class="header">
            <h1>
                Registration Form 
            </h1>
        </div>

        <form>
            <label action="" method="/POST">First name: </label>
            <input type="name" required="name" placeholder="Enter your first name">    
        </form><br>

        <form action="/" method="post">
            <label>Last name: </label>  
            <input type="name" required="name" placeholder="Enter your last name">    
        </form><br>

        <form>
            <label action="" method="/POST">Password: </label>
            <input type="password" required="password" placeholder="Enter your password">    
        </form><br>

        <form>
            <label action="" method="/POST">Student ID: </label>
            <input type="name" required="name" placeholder="Enter your ID">    
        </form><br>

        <form>
            <label action="" method="/POST"> Group: </label>
            <input type="name" required="name" placeholder="Enter the group name">    
        </form><br>

        <button class="btn">Submit</button>

    </body>

</html>
